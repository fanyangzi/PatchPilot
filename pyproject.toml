[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "Policy-constrained AI maintenance runtime for open-source repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
remote = ["httpx>=0.27", "pydantic>=2", "python-dotenv>=1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
